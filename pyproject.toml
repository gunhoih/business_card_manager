[project]
name = "smartscan"
version = "0.1.0"
description = "Streamlit document scanning and AI-powered document analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.65,<2",
    "opencv-python-headless>=5.0,<6",
    "numpy>=2.0,<3",
    "Pillow>=12,<14",
    "openai>=3.30,<4",
    "pydantic>=2.10,<3",
    "streamlit-image-coordinates>=0.4.1,<0.5",
]

[project.optional-dependencies]
pdf = [
    "PyMuPDF>=1.26,<2",
]

[tool.uv]
package = false
