[project]
name = "business-card-manager"
version = "0.1.0"
description = "Streamlit business card scanning and contact management"
requires-python = ">=3.12,<3.13"
dependencies = [
    "onnxruntime>=1.23.2,<2",
    "rapidocr==3.10.0",
    "streamlit>=1.65,<2",
    "opencv-python-headless>=5.0,<6",
    "numpy>=2.0,<3",
    "Pillow>=12,<14",
    "openai>=3.30,<4",
    "pydantic>=2.10,<3",
    "streamlit-image-coordinates>=0.4.1,<0.5",
    "pytesseract>=0.3.13,<0.4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.26,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
